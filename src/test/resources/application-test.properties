spring.datasource.url=jdbc:h2:mem:test-${random.uuid};DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:database/create_tables.sql
spring.sql.init.data-locations=classpath:database/insert_data.sql

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

jwt.secret=classroom-test-key-only-at-least-32-bytes
jwt.expiration-ms=3600000

spring.cache.type=none

spring.config.import=